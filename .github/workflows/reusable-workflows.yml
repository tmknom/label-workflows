name: Label Reusable Workflows
on:
  workflow_call:
    inputs:
      pr-number:
        type: string
        required: false
        description: The pull request number(s).
    outputs:
      configuration-sha256:
        value: ${{ jobs.label.outputs.configuration-sha256 }}
        description: SHA256 of the configuration file to passing actions/labeler.

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  label:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      configuration-sha256: ${{ steps.labeler.outputs.configuration-sha256 }}
    steps:
      - name: Checkout
        uses: tmknom/secure-checkout-action@v1

      - name: Cross Labeler
        id: labeler
        uses: tmknom/cross-labeler-action@107eedbc3ed6010fc393a793a6221f469afec282 # v0.5.1
        with:
          pr-number: ${{ inputs.pr-number }}
          configuration-url: https://raw.githubusercontent.com/tmknom/configurations/128cc66301fe96e449a1e284bb78d5e2ecfb96f2/labeler/reusable-workflows.yml # v0.6.0
